<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Password Strength Checker</h1>
    <p class="note">Safespace for your passwords</p>

    <input type="password" id="password" placeholder="Go on don't be shy">

    <div class="bar"><div id="bar-fill"></div></div>
    <p id="verdict"></p>

    <ul id="tips">
        <li>atleast 8 characters minimum</li>
    </ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
